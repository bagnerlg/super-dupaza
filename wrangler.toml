name = "super-dupaza"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "super-dupaza"
database_id = "563340a2-a9d6-4bf4-9471-cf67d37413c7"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "9a533ddbf55b40d9ba75af7d92a91828"

[[queues.producers]]
binding = "SUPER_DUPAZA_SYNC_QUEUE"
queue = "super-dupaza-sync"

[[queues.consumers]]
queue = "super-dupaza-sync"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
max_concurrency = 1
